# Secret scan of the whole repository: the tree, then every commit of the
# history, on every pull request and every push to main. A secret in any
# commit is public once it is pushed, whatever range a change adds.
# "Secret scan (gitleaks)" is a required check of main (a ruleset).
# gitleaks runs as its released binary, checked against the sha256 of the
# release's checksums file before it runs; the allow-list is .gitleaks.toml.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    timeout-minutes: 15
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan the tree for secrets
        run: /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Scan the whole history for secrets
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
