# Dependabot keeps the actions the workflows run current. Every action is
# pinned to a commit with its release in a comment
# (`uses: owner/action@<sha> # v1.2.3`); Dependabot proposes the next
# release's commit and rewrites both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
